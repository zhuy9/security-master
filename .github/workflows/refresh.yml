name: refresh

on:
  schedule:
    - cron: "17 15 * * 1-5" # weekdays, after SEC regenerates its ticker files (12:00-14:00 UTC)
  workflow_dispatch:
    inputs:
      full:
        description: "Refetch every issuer from SEC, not only new ones"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # the branch tip, not the triggering commit: a queued or re-run job must build on the latest data
      - run: python3 tests/test_build.py && python3 tests/test_client.py
      - name: Build
        env:
          EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          FULL: ${{ inputs.full }}
        # Mondays refetch every issuer, since names and SIC codes drift; other days only new CIKs.
        run: |
          if [ "$FULL" = "true" ] || [ "$(date -u +%u)" = 1 ]; then python3 src/build.py --full; else python3 src/build.py; fi
      # Commits whenever data/ changed. A refused build exits non-zero above and writes nothing, so
      # bad data never gets here; GitHub emails the repo owner about the failed run.
      - name: Commit
        run: |
          git add data
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "data: refresh $(date -u +%F)"
          git push
